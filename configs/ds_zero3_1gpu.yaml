# configs/ds_zero3_1gpu.yaml — pilot config (1 GPU). Keeps ZeRO-3 so the
# adapter-save path is exercised the same way as the multi-GPU runs.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  zero_stage: 3
  zero3_init_flag: true
  zero3_save_16bit_model: true
  offload_optimizer_device: none
  offload_param_device: none
  gradient_clipping: 1.0
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
